<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bino Whack-a-Mole Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
    }
    h1 {
      color: #1e293b;
      margin-bottom: 8px;
      font-size: 2.2rem;
    }
    p.subtitle {
      color: #64748b;
      margin-bottom: 20px;
    }
    .score-board {
      display: flex;
      gap: 30px;
      justify-content: center;
      margin-bottom: 25px;
      background: #ffffff;
      padding: 12px 28px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .stat-item {
      font-size: 1.1rem;
      font-weight: 600;
      color: #334155;
    }
    .stat-item span {
      color: #2563eb;
      font-size: 1.4rem;
    }
    .controls {
      margin-bottom: 30px;
    }
    button {
      padding: 12px 30px;
      font-size: 1rem;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 4px 6px rgba(22, 163, 74, 0.2);
      transition: all 0.2s ease;
    }
    button:hover:not(:disabled) {
      background: #15803d;
      transform: translateY(-2px);
    }
    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      transform: none;
    }
    /* 3x3 Game Board Grid */
    .game-grid {
      width: 480px;
      max-width: 90vw;
      height: 480px;
      max-height: 90vw;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-gap: 20px;
      margin: 0 auto;
    }
    .hole {
      background: #854d0e;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 10px 0 0 #543109, 0 4px 6px rgba(0,0,0,0.1);
    }
    /* The Mole */
    .mole {
      width: 65%;
      height: 65%;
      background: #ea580c;
      border-radius: 50% 50% 20% 20%;
      position: absolute;
      top: 100%; /* Hidden underneath the hole */
      left: 17.5%;
      transition: top 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      user-select: none;
    }
    /* Mole popped up state */
    .hole.up .mole {
      top: 15%;
    }
  </style>
</head>
<body>

  <h1>Bino Whack-a-Mole Game</h1>
  <p class="subtitle">Vanilla JavaScript DOM & Timer Demonstration</p>

  <div class="score-board">
    <div class="stat-item">Score: <span id="score">0</span></div>
    <div class="stat-item">Time Left: <span id="time-left">30</span>s</div>
  </div>

  <div class="controls">
    <button id="start-btn" onclick="startGame()">Start Game</button>
  </div>

  <div class="game-grid">
    <div class="hole hole1"><div class="mole" onclick="whack(event)">🐹</div></div>
    <div class="hole hole2"><div class="mole" onclick="whack(event)">🐹</div></div>
    <div class="hole hole3"><div class="mole" onclick="whack(event)">🐹</div></div>
    <div class="hole hole4"><div class="mole" onclick="whack(event)">🐹</div></div>
    <div class="hole hole5"><div class="mole" onclick="whack(event)">🐹</div></div>
    <div class="hole hole6"><div class="mole" onclick="whack(event)">🐹</div></div>
    <div class="hole hole7"><div class="mole" onclick="whack(event)">🐹</div></div>
    <div class="hole hole8"><div class="mole" onclick="whack(event)">🐹</div></div>
    <div class="hole hole9"><div class="mole" onclick="whack(event)">🐹</div></div>
  </div>

  <script>
    const holes = document.querySelectorAll('.hole');
    const scoreBoard = document.getElementById('score');
    const timeLeftBoard = document.getElementById('time-left');
    const startBtn = document.getElementById('start-btn');

    let lastHole;
    let timeUp = false;
    let score = 0;
    let countdown = 30;
    let timerId;

    // Helper: Generate random time for mole appearance (in milliseconds)
    function randomTime(min, max) {
      return Math.round(Math.random() * (max - min) + min);
    }

    // Helper: Select a random hole without picking the same one consecutively
    function randomHole(holes) {
      const idx = Math.floor(Math.random() * holes.length);
      const hole = holes[idx];
      if (hole === lastHole) {
        return randomHole(holes);
      }
      lastHole = hole;
      return hole;
    }

    // Mole popping logic
    function peep() {
      const time = randomTime(600, 1100);
      const hole = randomHole(holes);
      hole.classList.add('up');

      setTimeout(() => {
        hole.classList.remove('up');
        if (!timeUp) peep();
      }, time);
    }

    // Start game initialization
    function startGame() {
      score = 0;
      countdown = 30;
      timeUp = false;
      scoreBoard.textContent = 0;
      timeLeftBoard.textContent = countdown;
      startBtn.disabled = true;

      peep();

      timerId = setInterval(() => {
        countdown--;
        timeLeftBoard.textContent = countdown;
        if (countdown <= 0) {
          clearInterval(timerId);
          timeUp = true;
          startBtn.disabled = false;
          alert('Game Over! Your final score is: ' + score);
        }
      }, 1000);
    }

    // Click/Whack handler
    function whack(e) {
      if (!e.isTrusted) return; // Prevent fake script clicks
      score++;
      e.target.parentElement.classList.remove('up');
      scoreBoard.textContent = score;
    }
  </script>
</body>
</html>
